name: Tests

# Runs on GitHub's own machines, not the self-hosted VMs, so code from a pull request
# never runs on prod or dev.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,spark]"
      - run: ruff check src tests
      - run: pytest -q
