name: Bronze ingest

# Fetches one Entur SIRI ET snapshot on the prod VM. Runs only from the default branch.
# No schedule: the 5-min collection runs from cron on the VM (scripts/run_bronze_cron.sh).
# A schedule here would fetch every snapshot twice. Trigger manually only for tests.
on:
  workflow_dispatch:

# Never overlap two runs; a late run waits instead of being cancelled.
concurrency:
  group: bronze-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: [self-hosted, prod]
    steps:
      - name: Fetch Bronze snapshot
        run: |
          cd ~/app
          ~/venv/bin/python jobs/run_pipeline.py bronze --config config/prod.yaml
