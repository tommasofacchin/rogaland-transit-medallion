[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "entur-pipeline"
version = "0.1.0"
description = "DAT535: Entur real-time punctuality pipeline (Bronze -> Silver -> Gold)"
requires-python = ">=3.10"
dependencies = ["requests", "pyyaml"]

[project.optional-dependencies]
spark = ["pyspark==4.1.3"]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
